name: Release

# 推送形如 v2.37.0 的 tag 时自动发布到 npm
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance 需要
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史与分支，用于校验 tag 来源分支
          fetch-depth: 0

      # 发布前先做来源与命名校验，避免从任意 tag 或未合入的提交误发布
      - name: 校验 tag 命名与来源分支
        run: |
          set -euo pipefail

          # 只允许 v<major>.<minor>.<patch>，可带预发布后缀，如 v2.37.0 / v2.38.0-rc.1
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag 命名不合法: $GITHUB_REF_NAME（应形如 v1.2.3 或 v1.2.3-rc.1）"
            exit 1
          fi

          # 拉取受保护分支以判断 tag 提交是否已合入
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*' || true

          reachable=0
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then reachable=1; fi
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/release); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then reachable=1; fi
          done

          if [ "$reachable" -ne 1 ]; then
            echo "::error::tag $GITHUB_REF_NAME 所在提交不属于 master 或 release/* 分支，禁止发布"
            exit 1
          fi
          echo "tag 来源校验通过: $GITHUB_REF_NAME"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm 10.8.2 存在 "Exit handler never called!" 崩溃且返回 exit 0 的缺陷，
      # 会导致依赖只装一半、.bin 未建立却被判定为成功，故固定到修复后的版本。
      - name: 升级 npm
        run: npm install -g npm@10.9.2

      # npm 崩溃时可能返回 exit 0，导致依赖只装一半、.bin 未建立却被判定为成功，
      # 后续步骤才以 exit 127 失败。这里在安装后立即校验关键可执行文件，
      # 缺失则清空 node_modules 重装，最多尝试 3 次。
      - name: 安装依赖
        run: |
          for attempt in 1 2 3; do
            echo "::group::第 $attempt 次安装依赖"
            npm ci || echo "npm ci 返回非 0，继续校验产物"
            echo "::endgroup::"

            missing=""
            for bin in eslint tsc vitest rollup; do
              [ -x "node_modules/.bin/$bin" ] || missing="$missing $bin"
            done

            if [ -z "$missing" ]; then
              echo "依赖完整性校验通过"
              exit 0
            fi

            echo "::warning::第 $attempt 次安装不完整，缺少:$missing"
            rm -rf node_modules
          done

          echo "::error::依赖安装连续 3 次不完整，缺少:$missing"
          exit 1

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本 ($TAG_VERSION) 与 package.json 版本 ($PKG_VERSION) 不一致"
            exit 1
          fi
          echo "版本校验通过: $PKG_VERSION"

      - name: 代码规范检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建产物
        run: npm run build

      - name: 发布
        run: |
          # 预发布 tag（如 v2.38.0-rc.1）发布到 next，正式 tag 发布到 latest
          DIST_TAG=latest
          case "$GITHUB_REF_NAME" in
            *-*) DIST_TAG=next ;;
          esac
          echo "发布 dist-tag: $DIST_TAG"
          npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
