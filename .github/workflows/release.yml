name: Release

# 推送形如 v2.37.0 的 tag 时自动发布到 npm
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance 需要
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm 10.8.2 存在 "Exit handler never called!" 崩溃且返回 exit 0 的缺陷，
      # 会导致依赖只装一半、.bin 未建立却被判定为成功，故固定到修复后的版本。
      - name: 升级 npm
        run: npm install -g npm@10.9.2

      # npm 崩溃时可能返回 exit 0，导致依赖只装一半、.bin 未建立却被判定为成功，
      # 后续步骤才以 exit 127 失败。这里在安装后立即校验关键可执行文件，
      # 缺失则清空 node_modules 重装，最多尝试 3 次。
      - name: 安装依赖
        run: |
          for attempt in 1 2 3; do
            echo "::group::第 $attempt 次安装依赖"
            npm ci || echo "npm ci 返回非 0，继续校验产物"
            echo "::endgroup::"

            missing=""
            for bin in eslint tsc vitest rollup; do
              [ -x "node_modules/.bin/$bin" ] || missing="$missing $bin"
            done

            if [ -z "$missing" ]; then
              echo "依赖完整性校验通过"
              exit 0
            fi

            echo "::warning::第 $attempt 次安装不完整，缺少:$missing"
            rm -rf node_modules
          done

          echo "::error::依赖安装连续 3 次不完整，缺少:$missing"
          exit 1

      - name: 校验 tag 与 package.json 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag 版本 ($TAG_VERSION) 与 package.json 版本 ($PKG_VERSION) 不一致"
            exit 1
          fi
          echo "版本校验通过: $PKG_VERSION"

      - name: 代码规范检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm run test

      - name: 构建产物
        run: npm run build

      - name: 发布
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
